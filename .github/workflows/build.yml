name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
    - name: Output rust version for educational purposes
      run: rustup --version

    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable

    # The docs are warning-free; keep them that way.
    - name: Build the documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps

  msrv:
    # Cargo.toml declares rust-version = "1.85"; make sure that stays true.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install the MSRV toolchain
      run: rustup toolchain install 1.85.0 --profile minimal && rustup override set 1.85.0
    - name: Output rust version for educational purposes
      run: rustup --version

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  build:
    # Pure Rust with no dependencies, but the codec does a lot of bit twiddling,
    # so it is worth exercising on every target we claim to support.
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
          - os: ubuntu-latest
            toolchain: nightly

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup override set ${{ matrix.toolchain }}
    - name: Output rust version for educational purposes
      run: rustup --version

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      env:
        RUST_BACKTRACE: full
      run: cargo test --verbose
